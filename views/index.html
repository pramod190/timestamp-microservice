    <title>Timestamp Microservice</title>
  </head>
  <body>
    <main>
      <h1>Timestamp Microservice</h1>
      <p>Convert a date or Unix timestamp into Unix milliseconds and a UTC date string.</p>
      <h2>Examples</h2>
      <ul>
        <li><a href="/api">/api</a> — current date and time</li>
        <li><a href="/api/1451001600000">/api/1451001600000</a> — Unix timestamp</li>
        <li><a href="/api/2015-12-25">/api/2015-12-25</a> — date string</li>
        <li><a href="/api/invalid-date">/api/invalid-date</a> — invalid date response</li>
      </ul>
    </main>
  </body>
</html>
